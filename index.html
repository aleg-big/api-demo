<!DOCTYPE html>
<html>
<head>
  <title>My API Demo</title>
  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 15px;
      overflow: auto;
    }
  </style>
</head>
<body>

<h1>API Demo</h1>

<p>
Press the button to request data from an API.
</p>

<button onclick="loadData()">Get User</button>

<h2>Step 1 - Request Sent</h2>
<div id="step1"></div>

<h2>Step 2 - Response Received</h2>
<pre id="result"></pre>

<script>
async function loadData() {

  document.getElementById("step1").innerHTML =
    "GET request sent to https://jsonplaceholder.typicode.com/users/1";

  const response =
    await fetch("https://jsonplaceholder.typicode.com/users/1");

  const data = await response.json();

  document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
